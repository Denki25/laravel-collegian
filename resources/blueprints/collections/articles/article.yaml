title: Article
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: category
            field:
              type: select
              display: Category
              options:
                news: News
                opinion: Opinion
                features: Features
                devcom: DevCom
                sports: Sports
                literary: Literary
                komiks: Komiks
                multimedia: Multimedia
                issues: Issues
                editorial: Editorial
                column: Column
                infographics: Infographics
          -
            handle: displayCategory
            field:
              type: text
              display: Display Category
              instructions: 'Example: NEWS or PANITIKAN.'
          -
            handle: summary
            field:
              type: textarea
              display: Summary
              instructions: 'Short excerpt shown in cards and previews.'
          -
            handle: author
            field:
              type: text
              display: Author
          -
            handle: authorLine
            field:
              type: text
              display: Byline
              instructions: 'Example: By MARCO BACNIS/CLSU Collegian'
          -
            handle: readTime
            field:
              type: text
              display: Read Time
              instructions: 'Example: 2 min read'
          -
            handle: image
            field:
              type: text
              display: Featured Image
              instructions: 'Relative path inside public/, for example PHOTOS/NEWS/news16.jpg'
          -
            handle: imageAlt
            field:
              type: text
              display: Image Alt Text
          -
            handle: imageCaption
            field:
              type: text
              display: Image Caption
          -
            handle: content
            field:
              type: bard
              display: Article Content
              instructions: 'Edit the full article body here.'
          -
            handle: featured
            field:
              type: toggle
              display: Featured
